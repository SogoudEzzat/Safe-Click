<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <title>تسجيل الدخول</title>

  <link rel="icon" type="image/png" href="./home/hom.jpeg">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- اللوجو -->
  <div class="top-left-logo">
    <img
      src="./log-removebg-preview.png"
      alt="Safe Click Logo"
    />
  </div>

  <!-- كارت تسجيل الدخول -->
  <div class="auth-card">

    <h2>تسجيل الدخول</h2>

    <form id="loginForm">

      <!-- الإيميل -->
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>

        <input 
          type="email"
          name="email"
          id="email"
          placeholder="example@mail.com"
          autocomplete="email"
          required
        >
      </div>

      <!-- الباسورد -->
      <div class="form-group">
        <label for="password">كلمة المرور</label>

        <input
          type="password"
          name="password"
          id="password"
          placeholder="********"
          autocomplete="current-password"
          required
        >
      </div>

      <!-- زر الدخول -->
      <button type="submit" id="submitBtn">
        دخول
      </button>

      <!-- الرسالة -->
      <div id="responseMsg" class="message"></div>

      <!-- لينك التسجيل -->
      <p>
        ليس لديك حساب؟
        <a href="./sing.html">
          أنشئ حساباً جديداً
        </a>
      </p>

    </form>

  </div>

  <script src="./index.js"></script>

</body>
</html>
