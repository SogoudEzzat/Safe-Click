<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب جديد</title>
  <link rel="icon" type="image/png" href="./home/hom.jpeg">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  
   <div class="top-left-logo">
    <img
      src="./log-removebg-preview.png"
      alt="Safe Click Logo"
    />
  </div>
  <div class="auth-card">
    <h2>إنشاء حساب</h2>
    <form id="signupForm">
      <div class="form-group">
        <label for="name">اسم المستخدم</label>
        <input type="text" name="name" id="name" placeholder="أدخل اسمك" required />
      </div>

      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" name="email" id="email" placeholder="example@mail.com" required />
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" name="password" id="password" placeholder="********" minlength="8" required />
      </div>

     

      <button type="submit" id="submitBtn">
        <span id="btnText">تسجيل الحساب</span>
        <span id="loader" style="display:none;">⏳</span>
      </button>
      <div id="responseMsg" class="message"></div>
    </form>
  </div>

  <script src="./script.js"></script>
</body>
</html>
